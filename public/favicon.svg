<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="50%" stop-color="#2d4a6f" />
      <stop offset="100%" stop-color="#1a3050" />
    </linearGradient>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb" />
      <stop offset="50%" stop-color="#4a90a4" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a7c9b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6b9db8" stop-opacity="0.6" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGradient)" />
  
  <!-- 光泽 -->
  <rect x="2" y="2" width="44" height="22" rx="12" fill="white" fill-opacity="0.15" />
  
  <!-- 波纹 -->
  <path d="M6 34 Q12 30, 18 34 T30 34 T42 34" stroke="url(#waveGradient)" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M6 38 Q12 34, 18 38 T30 38 T42 38" stroke="url(#waveGradient)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6" />
  
  <!-- 水滴 -->
  <path d="M24 8 C24 8, 14 20, 14 26 C14 31.5 18.5 36 24 36 C29.5 36 34 31.5 34 26 C34 20, 24 8, 24 8 Z" fill="url(#dropGradient)" />
  
  <!-- 水滴高光 -->
  <ellipse cx="20" cy="22" rx="3" ry="4" fill="white" fill-opacity="0.4" />
</svg>
